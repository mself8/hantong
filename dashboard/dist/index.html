<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 통이면 돼유 · 담당자 화면</title>
<style>
  :root {
    --ink: #1c2230; --muted: #5d6676; --faint: #8a93a3; --bg: #f4f2ed; --card: #ffffff; --line: #e4e0d8;
    --brand: #1f6f4a; --brand-ink: #ffffff; --warn: #b42318; --warn-bg: #fdecea; --info-bg: #f1f3f6;
    --pending: #b7791f; --submitted: #2a5bd7; --confirmed: #1f6f4a; --notified: #5d6676; --held: #8a93a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 15px; line-height: 1.5; }
  button { font: inherit; cursor: pointer; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 14px 20px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; margin: 0; }
  header .who { color: var(--muted); }
  header .rule { margin-left: auto; color: var(--faint); font-size: 13px; }
  .tabs { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; color: var(--muted); }
  .tab b { color: var(--ink); margin-left: 4px; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab.on b { color: #fff; }
  .wrap { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 16px; padding: 12px 20px 32px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .row.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
  .row .top { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .row .name { font-weight: 700; color: var(--ink); }
  .row .sum { margin-top: 2px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; }
  .chip.pending { background: var(--pending); } .chip.submitted { background: var(--submitted); }
  .chip.confirmed { background: var(--confirmed); } .chip.notified { background: var(--notified); }
  .chip.held, .chip.processing { background: var(--held); }
  .warnmark { margin-left: auto; color: var(--warn); font-weight: 700; }
  .empty { color: var(--muted); padding: 24px 4px; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-height: 420px; }
  .dhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .dhead h2 { margin: 0; font-size: 20px; }
  .dhead .meta { color: var(--muted); font-size: 13px; width: 100%; }
  .primary { margin-left: auto; background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px;
    padding: 10px 16px; font-weight: 700; font-size: 15px; }
  .primary:disabled { background: #b9c0cb; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .tile { background: var(--info-bg); border-radius: 12px; padding: 10px 12px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 16px; font-weight: 700; margin-top: 2px; word-break: keep-all; }
  .tile select { width: 100%; margin-top: 6px; font: inherit; padding: 4px; }
  h3 { font-size: 15px; margin: 20px 0 8px; }
  .checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .checks li { border-radius: 10px; padding: 8px 12px; }
  .checks .warn { background: var(--warn-bg); color: var(--warn); }
  .checks .info { background: var(--info-bg); color: var(--muted); }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .app { border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .app .t { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  .app .to { color: var(--muted); font-size: 13px; }
  .app dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .app dt { color: var(--muted); } .app dd { margin: 0; }
  .app .notes { margin: 8px 0 0; padding-left: 16px; color: var(--warn); font-size: 13px; }
  .app details { margin-top: 6px; font-size: 13px; } .app summary { color: var(--muted); cursor: pointer; }
  .respond { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .respond input { flex: 1 1 140px; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .btn.ok { border-color: var(--brand); color: var(--brand); font-weight: 700; }
  .btn.no { color: var(--warn); }
  .chip.app-draft { background: var(--held); } .chip.app-submitted { background: var(--submitted); }
  .chip.app-confirmed { background: var(--confirmed); } .chip.app-rejected { background: var(--warn); }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .msgbar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .quotes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .quotes li { font-size: 14px; } .quotes b { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .turns { font-size: 14px; } .turns div { margin: 3px 0; } .turns b { display: inline-block; width: 52px; color: var(--muted); font-weight: 600; }
  .foot { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
  .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 12px 16px 32px; }
    .tabs { padding: 12px 16px 0; }
    header { padding: 12px 16px; }
    header .rule { margin-left: 0; width: 100%; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>한 통이면 돼유</h1>
  <span class="who">홍천군 통합돌봄 · 읍·면 접수 담당</span>
  <span class="who" id="today"></span>
  <span class="rule">AI는 정리만 해요 · 확인과 결정은 담당자가 해요</span>
</header>
<nav class="tabs" id="tabs"></nav>
<div class="wrap">
  <section class="list" id="list" aria-label="요청 목록"></section>
  <section class="detail" id="detail" aria-live="polite"><p class="empty">왼쪽에서 요청을 고르세요.</p></section>
</div>
<div class="toast" id="toast"></div>

<script>
const STATUS = { pending: "확인 대기", submitted: "기관 회신 대기", confirmed: "안내 대기", notified: "안내 완료", held: "보류", processing: "정리 중" };
const TABS = [["pending", "확인 대기"], ["submitted", "기관 회신 대기"], ["confirmed", "안내 대기"], ["notified", "안내 완료"], ["all", "전체"]];
const APP_STATUS = { draft: "작성됨", submitted: "제출함", confirmed: "확정", rejected: "불가" };
const KEY_FIELDS = { companion: ["진료일", "병원", "요금"], hope_taxi: ["운행일", "승차 지점", "목적지", "요금"], special_transport: ["진료일", "교통약자 등록", "요금"] };

let items = [], tab = "pending", selected = null, current = null, editingMsg = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = (iso) => (iso || "").slice(11, 16);
const dayOf = (iso) => { const d = new Date((iso || "").slice(0, 10) + "T00:00:00"); return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()}`; };
const warnCount = (r) => (r.checks || []).filter((c) => c.level === "warn").length;

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
async function act(path, body, method = "POST", done) {
  try {
    current = await api(path, { method, body: body ? JSON.stringify(body) : undefined });
    if (done) toast(done);
    await loadList(); renderDetail();
  } catch (e) { toast(e.message); }
}

async function loadList() {
  try { items = await api("/api/requests"); } catch (e) { return; }
  renderTabs(); renderList();
}

function renderTabs() {
  const n = (k) => k === "all" ? items.length : items.filter((r) => r.status === k).length;
  $("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button class="tab ${k === tab ? "on" : ""}" data-tab="${k}">${label}<b>${n(k)}</b></button>`).join("");
}

function renderList() {
  const rows = items.filter((r) => tab === "all" || r.status === tab);
  if (!rows.length) { $("list").innerHTML = `<p class="empty">이 상태의 요청이 없어요.</p>`; return; }
  $("list").innerHTML = rows.map((r) => {
    const res = r.resident || {};
    const who = res.name ? `${res.name} · ${res.village || ""}` : (r.pickup && r.pickup.village) || "명부 확인 필요";
    const w = warnCount(r);
    return `<button class="row ${r.id === selected ? "on" : ""}" data-id="${esc(r.id)}">
      <div class="top"><span class="chip ${esc(r.status)}">${esc(STATUS[r.status] || r.status)}</span>
        <span>${dayOf(r.created_at)} ${hhmm(r.created_at)}</span>${w ? `<span class="warnmark">확인 ${w}</span>` : ""}</div>
      <div class="name">${esc(who)}</div>
      <div class="sum">${esc(r.summary || "정리 중")}</div></button>`;
  }).join("");
}

function tile(k, v) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function primaryAction(r) {
  const apps = r.applications || [];
  const drafts = apps.filter((a) => a.status === "draft");
  const unsure = r.hospital && r.hospital.status === "candidates" && r.hospital.basis !== "department";
  if (r.status === "pending" && drafts.length) {
    return unsure
      ? `<span class="hint">병원을 먼저 골라 주세요</span><button class="primary" disabled>신청서 ${drafts.length}장 제출</button>`
      : `<button class="primary" data-act="submit">신청서 ${drafts.length}장 제출</button>`;
  }
  if ((r.status === "confirmed" || (r.status === "pending" && !apps.length)) && r.message && r.message.status !== "sent")
    return `<button class="primary" data-act="send">안내문 보내기</button>`;
  if (r.status === "submitted") return `<span class="hint">기관 답을 기다려요 · 시연에서는 신청서의 '기관 응답'을 눌러요</span>`;
  if (r.status === "notified") return `<span class="hint">안내까지 끝났어요</span>`;
  if (r.status === "held") return `<span class="hint">보류한 요청이에요</span>`;
  return "";
}

function renderDetail() {
  const r = current;
  if (!r) { $("detail").innerHTML = `<p class="empty">왼쪽에서 요청을 고르세요.</p>`; return; }
  const res = r.resident || {}, v = r.visit || {}, h = r.hospital || {}, c = r.companion || {}, p = r.pickup || {}, ev = r.evidence || {};
  const cands = h.candidates || [];
  let hosp;
  if (h.status === "matched" && cands.length && h.basis !== "department") hosp = esc(cands[0].name);
  else if (cands.length) hosp = `${h.basis === "department" ? "이름 모름 · " + esc(h.department || "") + " 후보" : "후보 " + cands.length + "곳"}
      <select data-act="hospital"><option value="">병원 고르기</option>${cands.map((x) =>
        `<option value="${esc(x.id)}">${esc(x.name)}${x.far ? " (관외)" : ""}</option>`).join("")}</select>`;
  else hosp = "확인 필요";
  const helps = [c.needed === "yes" ? "병원동행" : null, r.wheelchair_needed === "yes" ? "휠체어 차량" : null].filter(Boolean);
  const day = v.date ? `${v.date.slice(5).replace("-", "/")}${v.time ? " " + v.time : ""}` : esc(v.date_expr || "확인 필요");

  const checks = (r.checks || []).map((x) => `<li class="${esc(x.level)}">${esc(x.message)}</li>`).join("");
  const apps = (r.applications || []).map((a) => {
    const keys = KEY_FIELDS[a.type] || [];
    const f = a.fields || {};
    const main = keys.filter((k) => f[k]).map((k) => `<dt>${esc(k)}</dt><dd>${esc(f[k])}</dd>`).join("");
    const rest = Object.entries(f).filter(([k]) => !keys.includes(k)).map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join("");
    const notes = (a.notes || []).map((n) => `<li>${esc(n)}</li>`).join("");
    const resp = a.status === "submitted"
      ? `<div class="respond"><input placeholder="기관 답 (예: 9시에 마을회관으로 모시러 감)" data-detail="${esc(a.id)}">
           <button class="btn ok" data-act="confirm" data-app="${esc(a.id)}">기관 확정</button>
           <button class="btn no" data-act="reject" data-app="${esc(a.id)}">불가</button></div>`
      : (a.response ? `<div class="to">기관 답: ${esc(a.response.detail || (a.response.result === "confirmed" ? "확정" : "불가"))}</div>` : "");
    return `<div class="app"><div class="t">${esc(a.label)} <span class="chip app-${esc(a.status)}">${esc(APP_STATUS[a.status] || a.status)}</span></div>
      <div class="to">${esc(a.agency)} · ${esc(a.contact)}</div><dl>${main}</dl>
      ${notes ? `<ul class="notes">${notes}</ul>` : ""}
      ${rest ? `<details><summary>신청서 전체 보기</summary><dl>${rest}</dl></details>` : ""}${resp}</div>`;
  }).join("") || `<p class="empty">기관에 낼 신청서가 없는 건이에요.</p>`;

  const msg = r.message;
  const msgBlock = msg && msg.text
    ? (msg.status === "sent"
        ? `<div class="tile"><div class="k">보낸 안내문</div><div style="white-space:pre-wrap">${esc(msg.text)}</div></div>`
        : `<textarea id="msg">${esc(msg.text)}</textarea>
           <div class="msgbar"><button class="btn" data-act="savemsg">고친 내용 저장</button><span class="hint">어르신께 보내기 전 확인하세요</span></div>`)
    : `<p class="empty">기관이 모두 답하면 확정 안내문이 자동으로 만들어져요.</p>`;

  const quotes = [["병원", ev.hospital], ["날짜", ev.date], ["동행", ev.companion], ["마을", ev.village]]
    .filter(([, q]) => q).map(([k, q]) => `<li><b>${k}</b>"${esc(q)}"</li>`).join("");
  const turns = (r.transcript || []).map((t) => `<div><b>${t.role === "elder" ? "어르신" : "AI"}</b>${esc(t.text)}</div>`).join("");

  $("detail").innerHTML = `
    <div class="dhead"><h2>${esc(res.name ? `${res.name} 어르신` : "명부 확인 필요")}${res.age ? ` (${res.age})` : ""}</h2>
      <span class="chip ${esc(r.status)}">${esc(STATUS[r.status] || r.status)}</span>${primaryAction(r)}
      <div class="meta">${dayOf(r.created_at)} ${hhmm(r.created_at)} 전화 · ${esc(r.summary || "")}</div></div>
    <div class="tiles">${tile("가는 날", day)}${tile("병원", hosp)}${tile("필요한 도움", helps.length ? helps.join(" · ") : "교통만")}${tile("사는 곳", esc(p.village || "확인 필요") + (p.detail ? `<div class="k">${esc(p.detail)}</div>` : ""))}</div>
    ${checks ? `<h3>확인할 것</h3><ul class="checks">${checks}</ul>` : ""}
    <h3>기관별 신청서</h3><div class="apps">${apps}</div>
    <h3>어르신께 보낼 안내문</h3>${msgBlock}
    ${quotes ? `<h3>어르신 말씀</h3><ul class="quotes">${quotes}</ul>` : ""}
    <details style="margin-top:14px"><summary>통화 기록 전체 (${(r.transcript || []).length}줄)</summary><div class="turns">${turns}</div></details>
    <div class="foot">${r.status !== "held" && r.status !== "notified" ? `<button class="linkbtn" data-act="hold">보류하기</button>` : ""}</div>`;
}

async function select(id) {
  selected = id; editingMsg = false;
  try { current = await api(`/api/requests/${encodeURIComponent(id)}`); } catch (e) { current = null; }
  renderList(); renderDetail();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-id],[data-act]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; renderTabs(); renderList(); return; }
  if (t.dataset.id) { select(t.dataset.id); return; }
  const id = current && current.id;
  if (!id) return;
  const base = `/api/requests/${encodeURIComponent(id)}`;
  switch (t.dataset.act) {
    case "submit": act(`${base}/submit`, null, "POST", "신청서를 제출했어요"); break;
    case "send": {
      const box = $("msg");
      const send = () => act(`${base}/message/send`, null, "POST", "안내문을 보냈어요 (시연: 발송 기록)");
      if (box && box.value !== (current.message || {}).text) {
        api(`${base}/message`, { method: "PUT", body: JSON.stringify({ text: box.value }) }).then(send).catch((er) => toast(er.message));
      } else send();
      break;
    }
    case "savemsg": act(`${base}/message`, { text: $("msg").value }, "PUT", "안내문을 저장했어요"); editingMsg = false; break;
    case "confirm": case "reject": {
      const aid = t.dataset.app;
      const input = document.querySelector(`[data-detail="${aid}"]`);
      act(`${base}/applications/${aid}/respond`, { result: t.dataset.act === "confirm" ? "confirmed" : "rejected", detail: input ? input.value : "" },
        "POST", t.dataset.act === "confirm" ? "기관 확정을 기록했어요" : "불가를 기록했어요");
      break;
    }
    case "hold": act(`${base}/hold`, { memo: "" }, "POST", "보류했어요"); break;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.matches('select[data-act="hospital"]') && e.target.value && current)
    act(`/api/requests/${encodeURIComponent(current.id)}/hospital`, { hosp_id: e.target.value }, "POST", "병원을 골랐어요");
});
document.addEventListener("input", (e) => { if (e.target.id === "msg" || e.target.dataset.detail) editingMsg = true; });

async function tick() {
  await loadList();
  if (!selected && items.length) {
    const first = items.find((r) => tab === "all" || r.status === tab) || items[0];
    await select(first.id);
  } else if (selected && !editingMsg) {
    try { current = await api(`/api/requests/${encodeURIComponent(selected)}`); renderDetail(); } catch (e) {}
  }
}
const now = new Date();
$("today").textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${"일월화수목금토"[now.getDay()]})`;
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
