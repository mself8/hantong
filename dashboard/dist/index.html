<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 통이면 돼유 · 담당자 화면</title>
<style>
  /* 글꼴: 페이퍼로지(OFL). fonts/OFL.txt 참고 */
  @font-face { font-family: "Paperlogy"; src: url("/fonts/Paperlogy-4Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Paperlogy"; src: url("/fonts/Paperlogy-5Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Paperlogy"; src: url("/fonts/Paperlogy-6SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Paperlogy"; src: url("/fonts/Paperlogy-7Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

  /* 색과 크기는 범정부 디자인 시스템(KRDS)을 참고: 본문 17px, 정부 파랑 #256EF4 */
  :root {
    --text: #1e2124; --text-2: #464c53; --text-3: #6d7882; --line: #dcdfe3; --line-soft: #eceef1;
    --bg: #f4f5f7; --surface: #ffffff; --primary: #256ef4; --primary-dark: #0b50d0; --primary-soft: #eef4ff;
    --danger: #c9302c; --danger-soft: #fdeeee; --warn: #8a4b00; --warn-soft: #fff4e2; --warn-line: #f0b44c;
    --ok: #1e7b48; --ok-soft: #e9f6ee; --wait: #8a5a00; --wait-soft: #fff6dd; --info: #1d4fb8; --info-soft: #eaf1ff;
    --muted-soft: #eef0f3; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Paperlogy", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #9cc0ff; outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 위쪽 */
  .bar { background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1440px; margin: 0 auto; padding: 16px 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .org { color: var(--text-2); font-size: 16px; }
  .bar .right { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--text-3); font-size: 15px; }

  .main { max-width: 1440px; margin: 0 auto; padding: 24px 28px 48px; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
  .main.folded { grid-template-columns: minmax(0, 1fr); }
  .main.folded .list { display: none; }

  /* 목록 머리: 접기·펼치기 + 필터 */
  .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .side-h { display: flex; align-items: center; gap: 8px; }
  .fold { border: 0; background: none; padding: 6px 4px; font-size: 18px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .fold b { color: var(--primary); }
  .chev { display: inline-block; color: var(--text-3); transition: transform .15s; }
  .main.folded .fold .chev { transform: rotate(-90deg); }
  .filter { position: relative; margin-left: auto; }
  .filter-btn { height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; }
  .filter-btn b { color: var(--primary); }
  .menu { position: absolute; right: 0; top: 46px; z-index: 5; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, .12); padding: 6px; display: flex; flex-direction: column; }
  .menu[hidden] { display: none; }
  .menu button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 16px; display: flex; justify-content: space-between; gap: 16px; }
  .menu button:hover { background: var(--bg); }
  .menu button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

  /* 목록 */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); transition: border-color .15s, background .15s; }
  .row:hover { border-color: var(--line); }
  .row.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 4px 0 0 var(--primary); }
  .row .who { font-size: 18px; font-weight: 700; }
  .row .where { color: var(--text-2); font-size: 15px; margin-left: 6px; font-weight: 500; }
  .row .sum { margin: 4px 0 10px; color: var(--text); font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--text-3); font-size: 14px; }
  .empty { color: var(--text-3); padding: 28px 8px; font-size: 16px; }

  /* 배지 */
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-pending { background: var(--wait-soft); color: var(--wait); }
  .s-submitted { background: var(--info-soft); color: var(--info); }
  .s-confirmed { background: var(--ok-soft); color: var(--ok); }
  .s-notified, .s-held, .s-processing, .s-draft { background: var(--muted-soft); color: var(--text-2); }
  .s-rejected { background: var(--danger-soft); color: var(--danger); }
  .flag { background: var(--danger-soft); color: var(--danger); border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 600; }

  /* 상세 */
  .detail { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 18px; padding: 28px 32px 32px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); min-height: 480px; }
  .dh { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .dh .t { flex: 1 1 280px; }
  .dh h2 { margin: 0; font-size: 26px; line-height: 1.35; letter-spacing: -0.3px; }
  .dh .sub { color: var(--text-2); font-size: 16px; margin-top: 4px; }
  .act { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .primary { background: var(--primary); color: #fff; border: 0; border-radius: 12px; padding: 0 24px; height: 52px; font-size: 18px; font-weight: 600; }
  .primary:hover { background: var(--primary-dark); }
  .primary:disabled { background: #c4cad1; cursor: not-allowed; }
  .act .hint { color: var(--text-3); font-size: 14px; }
  .note { color: var(--text-2); font-size: 16px; background: var(--muted-soft); border-radius: 10px; padding: 10px 14px; }

  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 24px 0 8px; }
  .fact { background: var(--bg); border-radius: 14px; padding: 16px 18px; }
  .fact.check { box-shadow: inset 0 0 0 1.5px var(--warn-line); }
  .fact.missing { box-shadow: inset 0 0 0 1.5px #f2b8b5; }
  .fact .k { color: var(--text-3); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .flag { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .flag.check { background: var(--wait-soft); color: var(--wait); }
  .flag.missing { background: var(--danger-soft); color: var(--danger); }
  .fact .why { font-size: 13px; color: var(--text-3); margin-top: 6px; line-height: 1.45; }
  .fact .addr { font-size: 14px; color: var(--text-2); margin-top: 6px; line-height: 1.45; word-break: keep-all; }
  .fact .addr a { color: var(--primary); font-weight: 600; white-space: nowrap; }
  .fact .v { font-size: 21px; font-weight: 700; margin-top: 4px; line-height: 1.35; word-break: keep-all; }
  .fact .v small { display: block; font-size: 15px; font-weight: 500; color: var(--text-2); margin-top: 2px; }
  .fact select { width: 100%; margin-top: 8px; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: #fff; font-size: 16px; }

  section.part { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  section.part > h3 { font-size: 19px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  section.part > h3 .cnt { color: var(--text-3); font-weight: 500; font-size: 16px; }

  .callout { background: var(--warn-soft); border: 1px solid #f6d7a3; border-left: 5px solid var(--warn-line); border-radius: 12px; padding: 14px 18px; }
  .callout ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .callout li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
  .callout li::before { content: "!"; flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--warn-line); color: #fff; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; margin-top: 3px; }
  .callout li.info::before { content: "i"; background: #9aa4ae; }
  .callout li.info { color: var(--text-2); }

  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .app { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; background: #fff; }
  .app-h { display: flex; gap: 10px; align-items: flex-start; }
  .app-h .n { flex: 1; }
  .app-h .n b { font-size: 18px; display: block; }
  .app-h .n span { color: var(--text-3); font-size: 14px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 14px 0 0; font-size: 16px; }
  .kv dt { color: var(--text-3); font-size: 15px; } .kv dd { margin: 0; font-weight: 500; }
  .app .notes { margin: 14px 0 0; padding: 12px 14px; background: var(--bg); border-radius: 10px; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--text-2); }
  .app .notes li::before { content: "• "; color: var(--warn-line); font-weight: 700; }
  .respond { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
  .respond .rl { font-size: 14px; color: var(--text-3); }
  .forms { display: flex; flex-direction: column; gap: 10px; }
  .form-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .form-row > div { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .form-row b { font-size: 16px; }
  .form-row span { font-size: 14px; color: var(--text-3); }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 14px; }
  .respond .other:not([hidden]) { display: flex; gap: 8px; }
  .respond .other input { flex: 1; min-width: 0; }
  .replies { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .reply { align-self: flex-start; max-width: 90%; background: var(--bg, #f4f5f7); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 8px 12px; font-size: 15px; }
  .reply .num { color: var(--text-3); font-size: 13px; margin-right: 8px; }
  .respond input { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 16px; }
  .respond .btns { display: flex; gap: 8px; }
  .btn { height: 44px; border-radius: 10px; padding: 0 16px; font-size: 16px; font-weight: 600; border: 1px solid var(--line); background: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.no { color: var(--danger); }
  .answer { margin-top: 12px; font-size: 15px; color: var(--text-2); background: var(--ok-soft); border-radius: 10px; padding: 10px 12px; }

  .sms { max-width: 520px; background: #e9ebef; border-radius: 20px 20px 20px 6px; padding: 16px 18px; white-space: pre-wrap; font-size: 17px; }
  .sms-meta { color: var(--text-3); font-size: 14px; margin-top: 8px; }
  textarea { width: 100%; max-width: 640px; min-height: 140px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 17px; line-height: 1.6; }
  .msg-tools { display: flex; gap: 8px; margin-top: 10px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--primary); font-size: 15px; font-weight: 500; text-decoration: none; }

  .quotes { display: grid; gap: 10px; }
  .quote { border-left: 4px solid var(--line); padding: 4px 0 4px 14px; }
  .quote b { display: block; color: var(--text-3); font-size: 14px; font-weight: 500; }
  .turns { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .turn { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 16px; }
  .turn.ai { background: var(--bg); align-self: flex-start; }
  .turn.elder { background: var(--primary-soft); align-self: flex-end; }
  .turn i { display: block; font-style: normal; font-size: 13px; color: var(--text-3); }
  .log-box { background: #fff; border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px; margin-top: 0; }
  .foot { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; }
  .foot .linkbtn { color: var(--text-3); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: 16px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }

  @media (max-width: 980px) {
    .main { grid-template-columns: 1fr; padding: 16px 16px 40px; gap: 16px; }
    .bar-in { padding: 14px 16px; }
    .bar .right { margin-left: 0; width: 100%; }
    .detail { padding: 20px 18px 24px; border-radius: 16px; }
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .act { align-items: stretch; width: 100%; } .primary { width: 100%; }
    .apps { grid-template-columns: 1fr; }
    .turn { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <span class="logo">한 통이면 돼유</span>
  <span class="org">홍천군 통합돌봄 · 읍·면 접수 담당</span>
  <span class="right"><span id="today" class="num"></span></span>
</div></div>

<div class="main" id="main">
  <aside class="side">
    <div class="side-h">
      <button class="fold" id="fold" data-act="fold" aria-expanded="true" aria-controls="list">요청 목록 <b class="num" id="cnt"></b><span class="chev" aria-hidden="true">▾</span></button>
      <div class="filter">
        <button class="filter-btn" id="filterBtn" data-act="filter" aria-haspopup="listbox" aria-expanded="false"></button>
        <div class="menu" id="menu" role="listbox" aria-label="상태별 보기" hidden></div>
      </div>
    </div>
    <section class="list" id="list" aria-label="요청 목록"></section>
  </aside>
  <section class="detail" id="detail" aria-live="polite"><p class="empty">왼쪽에서 요청을 고르세요.</p></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const STATUS = { pending: "확인 대기", submitted: "기관 회신 대기", confirmed: "안내 대기", notified: "안내 완료", held: "보류", processing: "정리 중" };
const TABS = [["pending", "확인 대기"], ["submitted", "기관 회신 대기"], ["confirmed", "안내 대기"], ["notified", "안내 완료"], ["all", "전체"]];
const APP_STATUS = { draft: "요청 전", submitted: "요청함", confirmed: "확정", rejected: "불가" };
const KEY_FIELDS = { companion: ["진료일", "병원", "요금"], hope_taxi: ["운행일", "승차 지점", "목적지", "요금"], special_transport: ["진료일", "교통약자 등록", "요금"] };

let items = [], tab = "all", selected = null, current = null, editing = false, editMsg = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = (iso) => (iso || "").slice(11, 16);
const md = (iso) => { const d = (iso || "").slice(5, 10).split("-"); return d.length === 2 ? `${+d[0]}월 ${+d[1]}일` : ""; };
const warnCount = (r) => (r.checks || []).filter((c) => c.level === "warn").length;
const badge = (status, label) => `<span class="badge s-${esc(status)}">${esc(label)}</span>`;

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2000); }

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
async function act(path, body, method, done) {
  try {
    current = await api(path, { method, body: body ? JSON.stringify(body) : undefined });
    editing = false; editMsg = false;
    // 상태가 바뀌어 지금 필터에서 빠지면, 필터가 그 상태를 따라가서 이 요청이 목록에 계속 보이게 한다
    let moved = "";
    if (tab !== "all" && current.status !== tab) {
      tab = TABS.some(([k]) => k === current.status) ? current.status : "all";
      moved = ` · 목록을 '${(TABS.find(([k]) => k === tab) || [, "전체"])[1]}'(으)로 옮겼어요`;
    }
    if (done) toast(done + moved);
    await loadList(); renderTabs(); renderList(); renderDetail();
    return true;
  } catch (e) { toast(e.message); return false; }
}
// 공식 신청서 한 장(PDF 또는 워드)을 내려받는다
function download(id, kind, fmt) {
  const a = document.createElement("a");
  a.href = `/api/requests/${encodeURIComponent(id)}/forms/${kind}.${fmt === "docx" ? "docx" : "pdf"}`; a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
}

let listSig = "";
async function loadList() {
  let next;
  try { next = await api("/api/requests"); } catch (e) { return; }
  const sig = JSON.stringify(next);
  if (sig === listSig) return;  // 바뀐 게 없으면 다시 그리지 않는다
  listSig = sig; items = next;
  renderTabs(); renderList();
}
// 필터 버튼: 누르면 상태 메뉴가 열리고, 고르면 목록이 그 상태만 보인다
function renderTabs() {
  const n = (k) => k === "all" ? items.length : items.filter((r) => r.status === k).length;
  const [cur, label] = TABS.find(([k]) => k === tab) || TABS[0];
  $("filterBtn").innerHTML = `필터 · ${label}<span class="chev" aria-hidden="true">▾</span>`;
  $("menu").innerHTML = TABS.map(([k, l]) => `<button role="option" aria-selected="${k === tab}" class="${k === tab ? "on" : ""}" data-tab="${k}">${l}<b class="num">${n(k)}</b></button>`).join("");
  $("cnt").textContent = `${n(cur)}건`;
}
function openMenu(open) { $("menu").hidden = !open; $("filterBtn").setAttribute("aria-expanded", String(open)); }
function renderList() {
  const rows = items.filter((r) => tab === "all" || r.status === tab);
  if (!rows.length) { $("list").innerHTML = `<p class="empty">이 상태의 요청이 없어요.</p>`; return; }
  $("list").innerHTML = rows.map((r) => {
    const res = r.resident || {};
    const name = r.display_name ? `${r.display_name} 어르신` : "등록 정보 없음";
    const where = (r.pickup && r.pickup.village) || res.village || "";  // 통화에서 말한 곳이 먼저
    const w = warnCount(r);
    return `<button class="row ${r.id === selected ? "on" : ""}" data-id="${esc(r.id)}">
      <div><span class="who">${esc(name)}</span><span class="where">${esc(where)}</span></div>
      <div class="sum">${esc(r.summary || "정리 중이에요")}</div>
      <div class="meta">${badge(r.status, STATUS[r.status] || r.status)}<span class="num">${md(r.created_at)} ${hhmm(r.created_at)}</span>${w ? `<span class="flag">확인 ${w}건</span>` : ""}</div>
    </button>`;
  }).join("");
}

function action(r) {
  const apps = r.applications || [];
  const drafts = apps.filter((a) => a.status === "draft");
  const unsure = r.hospital && r.hospital.status === "candidates" && r.hospital.basis !== "department";
  if (r.status === "pending" && drafts.length)
    return unsure ? `<button class="primary" disabled>기관 ${drafts.length}곳에 요청</button><span class="hint">병원을 먼저 골라 주세요</span>`
                  : `<button class="primary" data-act="submit">기관 ${drafts.length}곳에 요청</button><span class="hint">전화로 요청한 뒤 눌러서 기록해요</span>`;
  if ((r.status === "confirmed" || (r.status === "pending" && !apps.length)) && r.message && r.message.status !== "sent")
    return `<button class="primary" data-act="send">어르신께 안내 보내기</button><span class="hint">아래 문자 내용을 확인하세요</span>`;
  if (r.status === "submitted") return `<span class="note">기관 회신을 기다리는 중이에요</span>`;
  if (r.status === "notified") return `<span class="note">안내까지 끝났어요</span>`;
  if (r.status === "held") return `<span class="note">보류한 요청이에요</span>`;
  return "";
}

const FLAG = { check: "확인 필요", missing: "모름" };
// 맨 위 칸 하나: 값은 늘 보여 주고, 믿기 어려우면 '확인 필요'·'모름' 표시와 이유를 단다(판정은 서버의 facts)
// 공식 신청서 한 장 = 파일 하나: PDF(인쇄용)와 워드(고쳐 쓰기용)
function formRow(label, kind, hint) {
  return `<div class="form-row"><div><b>${label}</b><span>${hint}</span></div>
    <button class="btn sm" data-act="form" data-kind="${kind}" data-fmt="pdf">PDF</button><button class="btn sm" data-act="form" data-kind="${kind}" data-fmt="docx">워드</button></div>`;
}
function tile(k, x, extra = "") {
  if (!x) return "";
  const lv = x.level || "ok";
  return `<div class="fact ${lv}"><div class="k">${k}${lv !== "ok" ? `<span class="flag ${lv}">${FLAG[lv]}</span>` : ""}</div>
    <div class="v">${esc(x.value)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</div>${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}${extra}</div>`;
}

function renderDetail() {
  const r = current;
  if (!r) { $("detail").innerHTML = `<p class="empty">왼쪽에서 요청을 고르세요.</p>`; return; }
  const res = r.resident || {}, h = r.hospital || {}, F = r.facts || {};
  const cands = h.candidates || [];
  const pick = cands.length > 1 && F.hospital && F.hospital.level !== "ok"
    ? `<select data-act="hospital" aria-label="병원 고르기"><option value="">병원 고르기</option>${cands.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}${x.far ? " (관외)" : ""}</option>`).join("")}</select>` : "";

  const checks = (r.checks || []);
  const callout = checks.length ? `<section class="part"><h3>확인할 것 <span class="cnt">${checks.length}건</span></h3>
    <div class="callout"><ul>${checks.map((x) => `<li class="${esc(x.level)}">${esc(x.message)}</li>`).join("")}</ul></div></section>` : "";

  const apps = (r.applications || []).map((a) => {
    const f = a.fields || {}, keys = KEY_FIELDS[a.type] || [];
    const kv = (pairs) => pairs.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join("");
    const main = kv(keys.filter((k) => f[k]).map((k) => [k, f[k]]));
    const notes = (a.notes || []).map((n) => `<li>${esc(n)}</li>`).join("");
    const replies = (a.replies || []).map((x) => `<div class="reply"><span class="num">${esc(hhmm(x.at))}</span>${esc(x.note)}</div>`).join("");
    const answer = a.response ? `<div class="answer">기관 회신: <b>${a.response.result === "confirmed" ? "가능" : "불가"}</b>${a.response.detail ? ` · ${esc(a.response.detail)}` : ""}</div>` : "";
    const resp = (a.status === "submitted"
      ? `<div class="respond"><span class="rl">기관 회신 (시연)</span>
           <div class="btns"><button class="btn ok" data-act="confirm" data-app="${esc(a.id)}">가능</button><button class="btn no" data-act="reject" data-app="${esc(a.id)}">불가</button><button class="btn" data-act="other" data-app="${esc(a.id)}">기타</button></div>
           <div class="other" data-other="${esc(a.id)}" hidden><input data-note="${esc(a.id)}" aria-label="기관 회신 메모" placeholder="예: 날짜를 하루 미뤄 달래요"><button class="btn" data-act="note" data-app="${esc(a.id)}">남기기</button></div></div>`
      : answer) + (replies ? `<div class="replies">${replies}</div>` : "");
    return `<article class="app"><div class="app-h"><div class="n"><b>${esc(a.label)}</b><span>${esc(a.agency)} · <span class="num">${esc(a.contact)}</span></span></div>
        ${badge(a.status === "draft" ? "draft" : a.status, APP_STATUS[a.status] || a.status)}</div>
      <dl class="kv">${main}</dl>${notes ? `<ul class="notes">${notes}</ul>` : ""}
      ${resp}</article>`;
  }).join("");
  const appsPart = `<section class="part"><h3>기관에 요청할 것 <span class="cnt">${(r.applications || []).length}건</span></h3>
    ${apps ? `<div class="apps">${apps}</div>` : `<p class="note">기관에 요청할 것이 없는 건이에요.</p>`}</section>
    <section class="part"><h3>공식 신청서 <span class="cnt">2종 · 파일마다 따로 내려받기</span></h3>
      <div class="forms">
        ${formRow("통합지원 신청서", "integrated", "돌봄 통합지원을 신청하는 공식 양식이에요.")}
        ${formRow("특별교통수단 등록 신청서", "special_transport", r.needs_registration
          ? "휠체어 차량을 처음 쓰시는 분이라 이 등록이 먼저 필요해요." : "휠체어 차량을 처음 쓰실 때만 필요해요.")}
      </div></section>`;

  const m = r.message;
  let msg;
  if (!m || !m.text) msg = `<p class="note">기관이 모두 답하면 확정 안내문이 자동으로 만들어져요.</p>`;
  else if (m.status === "sent") msg = `<div class="sms">${esc(m.text)}</div><div class="sms-meta">보냄 · 시연에서는 발송 기록만 남겨요</div>`;
  else if (editMsg) msg = `<textarea id="msg" aria-label="안내문 고치기">${esc(m.text)}</textarea>
      <div class="msg-tools"><button class="btn" data-act="savemsg">저장</button><button class="btn" data-act="cancelmsg">취소</button></div>`;
  else msg = `<div class="sms">${esc(m.text)}</div><div class="msg-tools"><button class="linkbtn" data-act="editmsg">문구 고치기</button></div>`;
  const msgPart = `<section class="part"><h3>어르신께 보낼 안내 문자</h3>${msg}</section>`;

  const turns = (r.transcript || []).map((t) => `<div class="turn ${t.role === "elder" ? "elder" : "ai"}"><i>${t.role === "elder" ? "어르신" : "AI 상담원"}</i>${esc(t.text)}</div>`).join("");

  $("detail").innerHTML = `
    <div class="dh"><div class="t"><h2>${esc(r.display_name ? `${r.display_name} 어르신` : "등록 정보 없음")}${res.age ? ` <span class="num" style="font-weight:500;color:var(--text-2)">(${res.age})</span>` : ""}</h2>
      <div class="sub">${badge(r.status, STATUS[r.status] || r.status)} <span class="num">${md(r.created_at)} ${hhmm(r.created_at)}</span> 전화${(r.pickup && r.pickup.village) || res.village ? " · " + esc((r.pickup && r.pickup.village) || res.village) : ""}</div></div>
      <div class="act">${action(r)}</div></div>
    <div class="facts">${tile("가는 날", F.date)}${tile("병원", F.hospital, pick)}${tile("교통수단", F.transport)}${tile("진료 시각", F.time)}${tile("필요한 도움", F.companion)}${tile("사는 곳", F.place, F.place && F.place.addr ? `<div class="addr">${esc(F.place.addr)}${F.place.url ? ` <a href="${esc(F.place.url)}" target="_blank" rel="noopener">지도 ↗</a>` : ""}</div>` : "")}</div>
    ${callout}${appsPart}${msgPart}
    <section class="part"><h3>통화 기록 전체 <span class="cnt">${(r.transcript || []).length}줄</span></h3><div class="turns log-box">${turns}</div></section>
    <div class="foot">${r.status !== "held" && r.status !== "notified" ? `<button class="linkbtn" data-act="hold">이 요청 보류하기</button>` : ""}</div>`;
}

async function select(id, tapped = false) {
  selected = id; editing = false; editMsg = false;
  try { current = await api(`/api/requests/${encodeURIComponent(id)}`); } catch (e) { current = null; }
  renderList(); renderDetail();
  // 휴대폰에서 목록을 눌렀을 때만 상세로 내려간다
  if (tapped && window.matchMedia("(max-width: 980px)").matches) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".filter")) openMenu(false);  // 메뉴 밖을 누르면 닫는다
  const t = e.target.closest("[data-tab],[data-id],[data-act]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; openMenu(false); renderTabs(); renderList(); return; }
  if (t.dataset.act === "filter") { openMenu($("menu").hidden); return; }
  if (t.dataset.act === "fold") {  // 요청 목록 접기·펼치기 (상세는 늘 보인다)
    const folded = $("main").classList.toggle("folded");
    $("fold").setAttribute("aria-expanded", String(!folded));
    return;
  }
  if (t.dataset.id) { select(t.dataset.id, true); return; }
  if (!current) return;
  const base = `/api/requests/${encodeURIComponent(current.id)}`;
  switch (t.dataset.act) {
    case "submit": act(`${base}/submit`, null, "POST", "기관에 요청했다고 기록했어요"); break;
    case "form": download(current.id, t.dataset.kind, t.dataset.fmt); break;
    case "send": act(`${base}/message/send`, null, "POST", "안내 문자를 보냈어요 (시연: 발송 기록)"); break;
    case "editmsg": editMsg = true; renderDetail(); break;
    case "cancelmsg": editMsg = false; renderDetail(); break;
    case "savemsg": act(`${base}/message`, { text: $("msg").value }, "PUT", "안내 문자를 고쳤어요"); break;
    case "confirm": case "reject":
      act(`${base}/applications/${t.dataset.app}/respond`, { result: t.dataset.act === "confirm" ? "confirmed" : "rejected", detail: "" },
        "POST", t.dataset.act === "confirm" ? "기관이 가능하다고 기록했어요" : "기관이 불가하다고 기록했어요");
      break;
    case "other": {  // 기타: 메모 칸을 펼친다
      const box = document.querySelector(`[data-other="${t.dataset.app}"]`);
      if (box) { box.hidden = false; box.querySelector("input").focus(); }
      break;
    }
    case "note": {
      const input = document.querySelector(`[data-note="${t.dataset.app}"]`);
      if (input && input.value.trim())
        act(`${base}/applications/${t.dataset.app}/respond`, { result: "note", detail: input.value.trim() }, "POST", "기관 회신 메모를 남겼어요");
      break;
    }
    case "hold": act(`${base}/hold`, { memo: "" }, "POST", "보류했어요"); break;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.matches('select[data-act="hospital"]') && e.target.value && current)
    act(`/api/requests/${encodeURIComponent(current.id)}/hospital`, { hosp_id: e.target.value }, "POST", "병원을 골랐어요");
});
document.addEventListener("input", (e) => { if (e.target.id === "msg" || e.target.dataset.detail) editing = true; });

async function tick() {
  await loadList();
  if (!selected && items.length) {
    const first = items.find((r) => tab === "all" || r.status === tab) || items[0];
    await select(first.id);
  } else if (selected && !editing && !editMsg) {
    try {
      const next = await api(`/api/requests/${encodeURIComponent(selected)}`);
      if (JSON.stringify(next) !== JSON.stringify(current)) { current = next; renderDetail(); }
    } catch (e) {}
  }
}
const now = new Date();
$("today").textContent = `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. (${"일월화수목금토"[now.getDay()]})`;
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
