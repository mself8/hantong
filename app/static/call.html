<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101826">
<title>한 통이면 돼유 · 전화</title>
<style>
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-4Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-6SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Paperlogy";src:url("/fonts/Paperlogy-7Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  :root { --bg1: #101826; --bg2: #1d2a3d; --text: #ffffff; --muted: #a9b4c4; --go: #22c55e; --stop: #ef4444; --chip: rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: linear-gradient(180deg, var(--bg1), var(--bg2)); color: var(--text); font-family: "Paperlogy", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all; -webkit-font-smoothing: antialiased; }
  .phone { max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
  .brand { color: var(--muted); font-size: 15px; letter-spacing: .5px; flex: 1 1 0; }
  .bottom { flex: 1 1 0; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .center { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 24px 0; }
  .who { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .avatar { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; font-size: 52px; font-weight: 700;
    background: radial-gradient(circle at 30% 30%, #4ade80, #15803d); box-shadow: 0 0 0 0 rgba(74, 222, 128, .5); }
  .avatar.talking { animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.55); } 100% { box-shadow: 0 0 0 26px rgba(74,222,128,0); } }
  .name { font-size: 30px; font-weight: 700; margin-top: 22px; }
  .status { font-size: 20px; margin-top: 14px; min-height: 30px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 15px; margin-top: 4px; min-height: 22px; text-align: center; }
  .controls { display: flex; align-items: flex-start; justify-content: center; gap: 28px; margin-top: 28px; }
  .slot { width: 64px; padding-top: 9px; }
  .tools { visibility: hidden; }
  .tools.on { visibility: visible; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; background: none; border: 0; font-family: inherit; padding: 0; }
  .tool span.c { width: 64px; height: 64px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; }
  .tool.active span.c { background: #fff; }
  .tool.active svg { fill: #101826; }
  .tool svg { width: 28px; height: 28px; fill: #fff; }
  .mainwrap { display: flex; flex-direction: column; align-items: center; }
  .main-btn { width: 82px; height: 82px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
    background: var(--go); box-shadow: 0 10px 28px rgba(34, 197, 94, .35); transition: transform .12s; }
  .main-btn:active { transform: scale(.95); }
  .main-btn.end { background: var(--stop); box-shadow: 0 10px 28px rgba(239, 68, 68, .35); }
  .main-btn.end svg { transform: rotate(135deg); }
  .main-btn:disabled { opacity: .5; cursor: default; }
  .main-btn svg { width: 38px; height: 38px; fill: #fff; transition: transform .2s; }
  .label { margin-top: 10px; color: var(--muted); font-size: 15px; }
  .script { width: 100%; margin-top: 28px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 14px 16px; font-size: 15px; line-height: 1.6; }
  .script b { display: block; color: #fff; margin-bottom: 6px; }
  .script div span { color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<main class="phone">
  <div class="brand">한 통이면 돼유</div>
  <div class="center">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true">한</div>
      <div class="name">홍천군 AI 상담원</div>
      <div class="status" id="status" aria-live="polite">준비 중…</div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="controls">
      <div class="slot tools" id="tools">
        <button class="tool" id="mute" type="button" aria-pressed="false">
          <span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>
          음소거
        </button>
      </div>
      <div class="mainwrap">
        <button class="main-btn" id="btn" type="button" disabled aria-label="전화 걸기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <div class="label" id="label">전화 걸기</div>
      </div>
      <div class="slot"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="script" id="script" hidden></div>
    <p class="note">마이크 사용을 허용해 주세요. 시연용 인터넷 통화라 요금이 들지 않아요.<br>실제 서비스는 군 대표번호로 전화를 받습니다.</p>
  </div>
</main>

<script type="module">
  const cfg = window.HANTONG || {};
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const btn = $("btn"), label = $("label"), status = $("status"), hint = $("hint"), avatar = $("avatar"), tools = $("tools"), mute = $("mute");
  const cardId = new URLSearchParams(location.search).get("card");
  let live = false, timer = null, started = 0;

  // 시험 카드(/call?card=V01)면 대본을 아래에 보여 준다
  if (cardId) {
    try {
      const cards = await (await fetch("/api/voice-cards")).json();
      const c = cards.find((x) => x.call_id === cardId);
      if (c) {
        const go = {yes: "같이 가 줄 사람이 필요하다고 말해요", no: "혼자 갈 수 있다고 말해요", unknown: "동행 얘기는 먼저 꺼내지 않아요(물으면 잘 모르겠다고)"}[c.동행] || c.동행;
        let sp = c.특별지시 || "", m;
        if ((m = sp.match(/^동행 정정 전 (yes|no)/)))
          sp = `처음엔 ${m[1] === "yes" ? "같이 가 줄 사람이 필요하다" : "혼자 갈 수 있다"}고 했다가, 나중에 ${c.동행 === "yes" ? "필요하다" : "혼자 갈 수 있다"}고 고쳐 말해요`;
        else if ((m = sp.match(/^시간 정정 전 (\d{1,2}:\d{2})/))) sp = `처음엔 ${m[1]}이라고 했다가 ${c.도착희망시각}로 고쳐 말해요`;
        else if (/^날짜 정정 전/.test(sp)) sp = `처음엔 다른 날을 말했다가 '${c.날짜표현}'로 고쳐 말해요`;
        const rows = [["말하는 방식", c.말하는_방식], ["병원", c.병원표현], ["날짜", c.날짜표현], ["시간", c.도착희망시각], ["동행", go],
          ["사는 마을", c.출발마을 === "모름" ? "물어도 모른다고 해요" : c.출발마을], ["특별 지시", sp], ["말투 예", c.말투 ? "~" + c.말투 : ""], ["딴 얘기", c.딴얘기]].filter(([, v]) => v);
        $("script").hidden = false;
        $("script").innerHTML = `<b>시험 카드 ${esc(c.call_id)} · 어르신 역할로 말해 주세요</b>` + rows.map(([k, v]) => `<div><span>${esc(k)}</span> · ${esc(v)}</div>`).join("");
      }
    } catch (e) { console.error(e); }
  }

  // 신호음(한국 통화 연결음: 440+480Hz, 1초 울리고 2초 쉼)
  let ac = null, ringTimer = null;
  function ring(on) {
    if (!on) { clearInterval(ringTimer); ringTimer = null; if (ac) { ac.close(); ac = null; } return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      const g = ac.createGain(); g.gain.value = 0.08; g.connect(ac.destination);
      for (const f of [440, 480]) { const o = ac.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); o.stop(ac.currentTime + 1); }
    };
    beep(); ringTimer = setInterval(beep, 3000);
  }
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  function setState(state) {
    btn.classList.toggle("end", state === "calling" || state === "live");
    btn.setAttribute("aria-label", state === "idle" || state === "ended" ? "전화 걸기" : "통화 끝내기");
    label.textContent = state === "idle" ? "전화 걸기" : state === "ended" ? "다시 걸기" : "통화 끝내기";
    tools.classList.toggle("on", state === "live");
    if (state !== "live") avatar.classList.remove("talking");
  }

  if (!cfg.publicKey) {
    status.textContent = "아직 설정 중이에요";
    hint.textContent = "잠시 뒤에 다시 열어 주세요.";
  } else {
    let Vapi;
    try { const mod = await import("https://esm.sh/@vapi-ai/web@3.1.0"); Vapi = mod.default?.default ?? mod.default; }
    catch (e) { const mod = await import("https://cdn.jsdelivr.net/npm/@vapi-ai/web@3.1.0/+esm"); Vapi = mod.default?.default ?? mod.default; }
    const vapi = new Vapi(cfg.publicKey);
    let state = "idle", cancelled = false;  // idle → calling(신호음) → live(통화 중) → ended

    const ended = (msg) => {
      if (state === "ended") return;  // 버튼과 'call-end' 알림이 겹쳐도 한 번만 처리
      ring(false); clearInterval(timer);
      const dur = started ? mmss(Math.floor((Date.now() - started) / 1000)) : null;
      live = false; started = 0; state = "ended"; setState("ended"); btn.disabled = false;
      status.textContent = dur ? `통화 종료 · ${dur}` : "통화 종료";
      hint.textContent = msg;
    };
    vapi.on("call-start", () => {
      if (cancelled) { try { vapi.end(); } catch (e) {} return; }  // 신호음 중에 취소했는데 뒤늦게 연결되면 바로 끊는다
      ring(false); live = true; state = "live"; started = Date.now(); setState("live"); btn.disabled = false;
      status.textContent = "통화 중 00:00"; hint.textContent = "편하게 말씀하세요";
      timer = setInterval(() => { status.textContent = "통화 중 " + mmss(Math.floor((Date.now() - started) / 1000)); }, 500);
    });
    vapi.on("speech-start", () => { if (state === "live") { avatar.classList.add("talking"); hint.textContent = "상담원이 말하는 중이에요"; } });
    vapi.on("speech-end", () => { avatar.classList.remove("talking"); if (state === "live") hint.textContent = "편하게 말씀하세요"; });
    vapi.on("call-end", () => { if (state === "live" || state === "calling") ended("신청이 담당 공무원 화면에 올라갔어요"); });
    vapi.on("error", (e) => { console.error(e); if (state !== "ended") ended("연결에 문제가 생겼어요. 다시 걸어 주세요."); });

    mute.addEventListener("click", () => {
      const on = !vapi.isMuted(); vapi.setMuted(on);
      mute.classList.toggle("active", on); mute.setAttribute("aria-pressed", String(on));
    });
    btn.addEventListener("click", async () => {
      if (state === "live") {  // 통화 끝내기: 상담원 쪽까지 끊고(end) 화면도 바로 바꾼다
        try { vapi.end(); } catch (e) { console.error(e); }
        ended("신청이 담당 공무원 화면에 올라갔어요");
        return;
      }
      if (state === "calling") {  // 신호음 중 취소
        cancelled = true;
        try { await vapi.stop(); } catch (e) { console.error(e); }
        ended("전화를 취소했어요");
        return;
      }
      cancelled = false; state = "calling"; setState("calling");
      status.textContent = "전화 거는 중…"; hint.textContent = ""; mute.classList.remove("active");
      ring(true);
      try { await vapi.start(cfg.assistantId, cardId ? { metadata: { card: cardId } } : undefined); }
      catch (e) { console.error(e); if (!cancelled) ended("마이크를 허용했는지 확인하고 다시 걸어 주세요."); }
    });
    btn.disabled = false;
    setState("idle");
    status.textContent = "버튼을 누르면 전화가 걸려요";
    hint.textContent = "";
  }
</script>
</body>
</html>
