<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 통이면 돼유 · 전화 걸기</title>
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --bg: #f6f4ef; --card: #ffffff; --go: #1f8a4c; --stop: #c93a32; --line: #e3dfd6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 16px 40px; text-align: center; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 17px; margin: 0 0 32px; }
  #btn { width: 200px; height: 200px; border-radius: 50%; border: 0; cursor: pointer;
         background: var(--go); color: #fff; font-size: 24px; font-weight: 700;
         display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
         box-shadow: 0 10px 30px rgba(31, 138, 76, .35); transition: transform .15s; }
  #btn:active { transform: scale(.97); }
  #btn.live { background: var(--stop); box-shadow: 0 10px 30px rgba(201, 58, 50, .35); }
  #btn:disabled { background: #9aa1ad; box-shadow: none; cursor: default; }
  #btn svg { width: 54px; height: 54px; }
  #status { font-size: 20px; font-weight: 600; min-height: 56px; margin: 26px 0 18px; line-height: 1.4; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
          text-align: left; font-size: 16px; line-height: 1.6; }
  .card b { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>한 통이면 돼유</h1>
  <p class="sub">홍천군 어르신 '병원 가는 날' AI 상담원</p>

  <button id="btn" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    <span id="label">전화 걸기</span>
  </button>

  <div id="status" aria-live="polite">준비 중이에요…</div>

  <div class="card" id="script">
    <b>이렇게 말해 보세요</b>
    "다음 주 화요일에 읍내 정형외과 가야 하는데, 혼자는 못 가겠어요."
  </div>
  <p class="note">마이크 사용을 허용해 주세요. 통화 내용은 시연용 신청서로 담당 공무원 화면에 올라갑니다.<br>
  실제 서비스는 군 대표번호로 전화를 받습니다.</p>
</main>

<script type="module">
  const cfg = window.HANTONG || {};
  const cardId = new URLSearchParams(location.search).get("card");
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  if (cardId) {
    try {
      const cards = await (await fetch("/api/voice-cards")).json();
      const c = cards.find((x) => x.call_id === cardId);
      if (c) {
        const go = {yes: "같이 가 줄 사람이 필요하다고 말해요", no: "혼자 갈 수 있다고 말해요", unknown: "동행 얘기는 먼저 꺼내지 않아요(물으면 잘 모르겠다고)"}[c.동행] || c.동행;
        const rows = [["말하는 방식", c.말하는_방식], ["병원", c.병원표현], ["날짜", c.날짜표현], ["시간", c.도착희망시각],
          ["동행", go], ["사는 마을", c.출발마을 === "모름" ? "물어도 모른다고 해요" : c.출발마을], ["특별 지시", c.특별지시],
          ["말투 예", c.말투 ? "~" + c.말투 : ""], ["딴 얘기", c.딴얘기]].filter(([, v]) => v);
        document.getElementById("script").innerHTML = `<b>시험 카드 ${esc(c.call_id)} · 어르신 역할로 말해 주세요</b>` +
          rows.map(([k, v]) => `<div><span style="color:#5b6475">${esc(k)}</span> · ${esc(v)}</div>`).join("");
      }
    } catch (e) { console.error(e); }
  }
  const btn = document.getElementById("btn");
  const label = document.getElementById("label");
  const statusEl = document.getElementById("status");
  const say = (t) => { statusEl.textContent = t; };

  if (!cfg.publicKey) {
    say("아직 설정 중이에요. 잠시 뒤에 다시 열어 주세요.");
  } else {
    let Vapi;
    try {
      const mod = await import("https://esm.sh/@vapi-ai/web@3.1.0");
      Vapi = mod.default?.default ?? mod.default;
    } catch (e) {
      const mod = await import("https://cdn.jsdelivr.net/npm/@vapi-ai/web@3.1.0/+esm");
      Vapi = mod.default?.default ?? mod.default;
    }
    const vapi = new Vapi(cfg.publicKey);
    let live = false;

    const setLive = (on) => {
      live = on;
      btn.classList.toggle("live", on);
      label.textContent = on ? "통화 끝내기" : "전화 걸기";
    };

    vapi.on("call-start", () => { setLive(true); btn.disabled = false; say("연결됐어요. 말씀하세요."); });
    vapi.on("speech-start", () => say("AI 상담원이 말하는 중이에요."));
    vapi.on("speech-end", () => { if (live) say("말씀하세요."); });
    vapi.on("call-end", () => { setLive(false); btn.disabled = false;
      say("통화가 끝났어요. 신청이 담당 공무원 화면에 올라갔어요."); });
    vapi.on("error", (e) => { console.error(e); setLive(false); btn.disabled = false;
      say("연결에 문제가 생겼어요. 다시 눌러 주세요."); });

    btn.addEventListener("click", async () => {
      if (live) { btn.disabled = true; await vapi.stop(); return; }
      btn.disabled = true;
      say("연결하는 중이에요…");
      try {
        await vapi.start(cfg.assistantId, cardId ? { metadata: { card: cardId } } : undefined);
      } catch (e) {
        console.error(e);
        btn.disabled = false;
        say("마이크를 허용했는지 확인하고 다시 눌러 주세요.");
      }
    });

    btn.disabled = false;
    say("버튼을 누르면 AI 상담원과 바로 통화돼요.");
  }
</script>
</body>
</html>
